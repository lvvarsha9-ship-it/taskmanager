<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
        form { display: flex; gap: 8px; }
        input[type=text] { flex: 1; padding: 8px; }
        button { padding: 8px 12px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ddd; }
        li span { flex: 1; }
        li.done span { text-decoration: line-through; color: #888; }
        #error { color: #c00; margin: 8px 0; min-height: 1.2em; }
    </style>
</head>
<body>
<h1>Task Manager</h1>

<form id="taskForm">
    <input type="text" id="title" placeholder="New task...">
    <button type="submit">Add</button>
</form>
<div id="error"></div>

<ul id="taskList"></ul>

<script>
    const API = "/tasks";
    const list = document.getElementById("taskList");
    const errorBox = document.getElementById("error");

    async function loadTasks() {
      const res = await fetch(API);
      const tasks = await res.json();
      list.innerHTML = "";
      tasks.forEach(task => {
        const li = document.createElement("li");
        if (task.done) li.className = "done";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.onchange = () => toggleTask(task);

        const span = document.createElement("span");
        span.textContent = task.title;

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = () => deleteTask(task.id);

        li.append(checkbox, span, del);
        list.appendChild(li);
      });
    }

    document.getElementById("taskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      const titleInput = document.getElementById("title");

      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: titleInput.value })
      });

      if (!res.ok) {
        const data = await res.json();
        errorBox.textContent = data.errors
  ? Object.values(data.errors).join(", ")
  : `Error ${res.status}: ${data.message || data.error || "unknown"}`;
        return;
      }
      titleInput.value = "";
      loadTasks();
    });

    async function toggleTask(task) {
      await fetch(`${API}/${task.id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: task.title, done: !task.done })
      });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API}/${id}`, { method: "DELETE" });
      loadTasks();
    }

    loadTasks();
</script>
</body>
</html>
